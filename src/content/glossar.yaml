# Glossar: Fachwörter in ein bis zwei Sätzen erklärt.
# id = Anker auf der Seite (nur Kleinbuchstaben, keine Umlaute), z. B. /glossar/#browser
- id: anhang
  wort: Anhang
  erklaerung: Eine Datei, die an einer E-Mail hängt, zum Beispiel ein Foto oder ein Brief. Öffnen Sie Anhänge nur, wenn Sie den Absender kennen und den Anhang erwarten.
- id: app
  wort: App
  erklaerung: Ein Programm, meist auf dem Handy. Auf dem iPhone holen Sie neue Apps aus dem „App Store“.
- id: browser
  wort: Browser
  erklaerung: Das Programm, mit dem Sie Internetseiten anschauen. Auf Ihrem Computer heißt es zum Beispiel „Microsoft Edge“ oder „Google Chrome“, auf dem iPhone „Safari“.
- id: cloud
  wort: Cloud
  erklaerung: Ein Speicherplatz im Internet. Ihre Fotos oder Dateien liegen dann nicht nur auf Ihrem Gerät, sondern zusätzlich bei einem Anbieter wie Apple, Google oder Microsoft.
- id: cookie
  wort: Cookie
  erklaerung: Eine kleine Notiz, die eine Internetseite auf Ihrem Gerät speichert. Viele Seiten fragen beim ersten Besuch, ob sie Cookies speichern dürfen. „Nur notwendige“ ist meist eine gute Wahl.
- id: cursor
  wort: Cursor
  erklaerung: Der blinkende senkrechte Strich in einem Text. Dort erscheint, was Sie tippen.
- id: datei
  wort: Datei
  erklaerung: Ein gespeichertes Stück Arbeit auf dem Computer, zum Beispiel ein Brief, ein Foto oder eine Liste.
- id: desktop
  wort: Desktop
  erklaerung: Die Fläche, die Sie nach dem Einschalten des Computers sehen. Dort liegen Symbole für Programme und Dateien.
- id: doppelklick
  wort: Doppelklick
  erklaerung: Zweimal schnell hintereinander auf die linke Maustaste drücken. Damit öffnen Sie Dateien und Ordner.
- id: download
  wort: Download
  erklaerung: Etwas aus dem Internet auf Ihr Gerät laden, zum Beispiel ein Formular oder ein Foto. Auf Deutsch auch „herunterladen“.
- id: fenster
  wort: Fenster
  erklaerung: Ein Rahmen auf dem Bildschirm, in dem ein Programm läuft. Oben rechts hat jedes Fenster Knöpfe zum Verkleinern, Vergrößern und Schließen.
- id: gemini
  wort: Gemini
  erklaerung: Der KI-Assistent von Google. Sie können ihm Fragen stellen, und er antwortet in ganzen Sätzen. Es gibt ihn als App auf dem iPhone und im Browser.
- id: google-konto
  wort: Google-Konto
  erklaerung: Ihr Zugang zu Diensten von Google, zum Beispiel Gmail oder Gemini. Sie melden sich mit Ihrer E-Mail-Adresse und Ihrem Passwort an.
- id: ki
  wort: KI (Künstliche Intelligenz)
  erklaerung: Ein Computerprogramm, das Fragen in normaler Sprache versteht und in ganzen Sätzen antwortet. Die KI kann sich aber auch irren.
- id: link
  wort: Link
  erklaerung: Ein Verweis auf eine andere Seite. Links sind oft blau und unterstrichen. Wenn Sie darauf klicken, öffnet sich die andere Seite.
- id: markieren
  wort: Markieren
  erklaerung: Text oder Dateien auswählen, damit Sie danach etwas damit machen können, zum Beispiel kopieren. Markierter Text ist farbig hinterlegt.
- id: menueband
  wort: Menüband
  erklaerung: Die breite Leiste oben in Word und Excel. Dort finden Sie alle Knöpfe, zum Beispiel für fette Schrift oder zum Drucken.
- id: ordner
  wort: Ordner
  erklaerung: Ein Behälter für Dateien auf dem Computer, so wie ein Aktenordner im Regal. Er hat meist ein gelbes Symbol.
- id: passwort
  wort: Passwort
  erklaerung: Ein geheimes Wort, mit dem Sie sich anmelden. Nur Sie sollten es kennen. Geben Sie es niemals am Telefon oder in einer E-Mail weiter.
- id: pdf
  wort: PDF
  erklaerung: Eine Art von Datei, die überall gleich aussieht. Rechnungen und Formulare kommen oft als PDF.
- id: phishing
  wort: Phishing
  erklaerung: Betrug mit gefälschten E-Mails, SMS oder Internetseiten. Die Betrüger wollen an Ihre Passwörter oder Ihr Geld.
- id: programm
  wort: Programm
  erklaerung: Ein Werkzeug auf dem Computer für eine bestimmte Aufgabe, zum Beispiel Word zum Schreiben oder Edge für das Internet.
- id: rechtsklick
  wort: Rechtsklick
  erklaerung: Einmal auf die rechte Maustaste drücken. Dann erscheint ein kleines Menü mit passenden Möglichkeiten.
- id: scrollen
  wort: Scrollen
  erklaerung: Eine Seite nach oben oder unten bewegen, zum Beispiel mit dem Rädchen an der Maus.
- id: spam
  wort: Spam
  erklaerung: Unerwünschte Werbe-E-Mails. Sie können Spam einfach löschen, ohne ihn zu öffnen.
- id: startmenue
  wort: Startmenü
  erklaerung: Das Menü, das sich öffnet, wenn Sie unten auf das Windows-Symbol klicken. Dort finden Sie alle Programme.
- id: taskleiste
  wort: Taskleiste
  erklaerung: Die Leiste ganz unten am Bildschirm. Dort sehen Sie das Windows-Symbol und alle geöffneten Programme.
- id: update
  wort: Update
  erklaerung: Eine Aktualisierung für ein Programm oder ein Gerät. Updates beheben Fehler und schließen Sicherheitslücken. Installieren Sie sie deshalb immer.
- id: wlan
  wort: WLAN
  erklaerung: Internet ohne Kabel, zum Beispiel über den Router zu Hause.
- id: zwischenablage
  wort: Zwischenablage
  erklaerung: Ein unsichtbarer Merkzettel im Computer. Wenn Sie etwas kopieren, liegt es dort, bis Sie es woanders einfügen.
- id: zwei-faktor
  wort: Zwei-Faktor-Anmeldung
  erklaerung: Eine doppelte Sicherung beim Anmelden. Sie brauchen Ihr Passwort und zusätzlich einen Code, der zum Beispiel per SMS auf Ihr Handy kommt.
- id: tab
  wort: Tab
  erklaerung: Ein Reiter oben im Browser, wie bei einem Karteikasten. Auf jedem Tab kann eine andere Internetseite offen sein.
- id: zelle
  wort: Zelle
  erklaerung: Ein einzelnes Kästchen in einer Excel-Tabelle. Jede Zelle hat einen Namen aus Buchstabe und Zahl, zum Beispiel B3.
- id: formel
  wort: Formel
  erklaerung: Eine Rechenanweisung in Excel. Sie beginnt immer mit einem Gleichheitszeichen, zum Beispiel =A1+A2. Excel rechnet das Ergebnis dann selbst aus.
- id: arbeitsmappe
  wort: Arbeitsmappe
  erklaerung: So heißt eine Excel-Datei. Sie kann mehrere Tabellen enthalten, die unten als Blätter angezeigt werden.
- id: bluetooth
  wort: Bluetooth
  erklaerung: Eine Funkverbindung über kurze Strecken, ganz ohne Kabel. Damit verbinden Sie zum Beispiel Kopfhörer oder einen Lautsprecher mit dem iPhone.
- id: diktieren
  wort: Diktieren
  erklaerung: Sprechen statt tippen. Das Gerät hört zu und schreibt Ihre Worte als Text auf. Auf dem iPhone tippen Sie dafür auf das Mikrofon in der Tastatur.
- id: facetime
  wort: FaceTime
  erklaerung: Die Videoanruf-App von Apple. Sie ist auf jedem iPhone dabei und funktioniert mit anderen iPhones und iPads.
- id: home-bildschirm
  wort: Home-Bildschirm
  erklaerung: Die Startseite des iPhones mit den Symbolen aller Apps. Dorthin kommen Sie zurück, wenn Sie vom unteren Rand nach oben wischen.
- id: iban
  wort: IBAN
  erklaerung: Die Nummer eines Bankkontos. Deutsche IBANs beginnen mit DE und haben 22 Zeichen. Sie brauchen die IBAN des Empfängers für eine Überweisung.
- id: konto
  wort: Konto (im Internet)
  erklaerung: Ihr persönlicher Zugang bei einer Internetseite oder App, zum Beispiel bei Amazon. Sie melden sich mit E-Mail-Adresse und Passwort an.
- id: lesezeichen
  wort: Lesezeichen
  erklaerung: Eine gespeicherte Internetseite im Browser. Mit einem Klick auf das Lesezeichen kommen Sie direkt hin, ohne die Adresse einzutippen. In Edge heißen sie auch „Favoriten“.
- id: online-banking
  wort: Online-Banking
  erklaerung: Bankgeschäfte im Internet erledigen, zum Beispiel den Kontostand ansehen oder Geld überweisen. Ihre Bank fragt Sie dabei nie per E-Mail oder Telefon nach PIN oder TAN.
- id: qr-code
  wort: QR-Code
  erklaerung: Ein kleines Quadrat aus schwarzen Punkten. Halten Sie die Kamera des iPhones darauf, erscheint ein Link. Tippen Sie nur darauf, wenn Sie der Quelle vertrauen.
- id: router
  wort: Router
  erklaerung: Das Kästchen mit den Lämpchen, das Ihr Zuhause mit dem Internet verbindet, zum Beispiel eine FRITZ!Box. Es macht auch das WLAN.
- id: scannen
  wort: Scannen
  erklaerung: Ein Blatt Papier abfotografieren und als Datei speichern, meist als PDF. Das geht mit einem Scanner oder einfach mit dem iPhone.
- id: suchmaschine
  wort: Suchmaschine
  erklaerung: Eine Internetseite, die andere Internetseiten findet. Die bekannteste ist Google. Sie tippen ein, was Sie suchen, und bekommen eine Liste mit Treffern.
- id: tan
  wort: TAN
  erklaerung: Ein Einmal-Code beim Online-Banking. Damit bestätigen Sie eine Überweisung. Heute bekommen Sie die TAN meist über die App Ihrer Bank. Geben Sie eine TAN niemals am Telefon weiter.
- id: videoanruf
  wort: Videoanruf
  erklaerung: Ein Telefonat, bei dem Sie sich gegenseitig sehen. Das geht zum Beispiel mit WhatsApp, FaceTime oder Zoom.
- id: virus
  wort: Virus
  erklaerung: Ein schädliches Programm, das sich auf Computern einnistet. Windows hat einen Schutz schon eingebaut. Warnungen mit Telefonnummer im Internet sind dagegen immer ein Betrugsversuch.
- id: zoom
  wort: Zoom
  erklaerung: Ein Programm für Videotreffen mit mehreren Menschen. Sie bekommen dafür einen Link und klicken einfach darauf. Zoomen heißt außerdem vergrößern.
